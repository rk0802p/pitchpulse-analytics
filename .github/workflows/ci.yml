name: PitchPulse CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax-check Node.js backend modules
        run: npm run lint

      - name: Run Backend Unit Tests & Baseline Invariant Verification
        run: node --test server/charts.test.js

  frontend-test-and-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Lint frontend source
        run: |
          cd frontend
          npx eslint src --quiet

      - name: Audit JavaScript dependencies (advisory)
        continue-on-error: true
        run: |
          cd frontend
          npm audit

      - name: Build Frontend Production Artifact
        env:
          CI: false
        run: |
          cd frontend
          npm run build
