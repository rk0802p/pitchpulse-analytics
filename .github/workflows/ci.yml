name: PitchPulse CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Invariant Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/Backend
      ADMIN_TOKEN: ci-admin-secret-token
      FLASK_ENV: testing
      TESTING: "True"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements-dev.txt

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest Backend/tests/ -v

      - name: Verify Baseline Cryptographic Invariants
        run: |
          python Backend/test_api_baseline.py

      - name: Check storage parity for protected and repaired seasons
        run: |
          python Backend/scripts/check_storage_parity.py --season 2024-2025
          python Backend/scripts/check_storage_parity.py --season 2025-2026

      - name: Audit Python dependencies (advisory)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r Backend/requirements-dev.txt

  frontend-test-and-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Lint frontend source
        run: |
          cd frontend
          npx eslint src --quiet

      - name: Audit JavaScript dependencies (advisory)
        continue-on-error: true
        run: |
          cd frontend
          npm audit

      - name: Build Frontend Production Artifact
        env:
          CI: false
        run: |
          cd frontend
          npm run build
