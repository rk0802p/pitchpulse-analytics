name: PitchPulse CI

on:
  push:
    branches: [ main, review-and-charts ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Invariant Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/Backend
      ADMIN_TOKEN: ci-admin-secret-token
      FLASK_ENV: testing
      TESTING: "True"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest Backend/tests/ -v

      - name: Verify Baseline Cryptographic Invariants
        run: |
          python Backend/test_api_baseline.py

  frontend-test-and-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Build Frontend Production Artifact
        env:
          CI: false
        run: |
          cd frontend
          npm run build
